name: .NET package SBOM and build provenance

# Implements the SBOM/provenance portions of docs/spec/quality-release.md's "Package build and provenance"
# release-engineering requirements for the .NET package, to the extent possible without owner publishing
# credentials, a signing certificate, or a live release/tag:
#
#   - "Generate an SBOM for each release or repository release bundle."
#   - "Generate provenance attestations for published artifacts and retain workflow/run references."
#   - "Sign NuGet packages when organizational infrastructure supports it and verify signatures after download."
#
# This workflow is split into three jobs with deliberately different trust levels:
#
#   - `sbom` runs dotnet/scripts/verify-package.ps1 (the same script dotnet-quality.yml runs) to pack and verify
#     the library, then generates both an SPDX and a CycloneDX SBOM with anchore/sbom-action (a widely used,
#     actively maintained tool that wraps Syft; SHA-pinned below like every other action in this repository) over
#     that exact, already-verified primary .nupkg/.snupkg -- never an independent, unverified `dotnet pack`. On a
#     trusted `dotnet-v*` tag push (this workflow's `on:` is the only one of this repository's .NET workflows
#     that triggers on a tag push at all) or a manual workflow_dispatch, it runs verify-package.ps1's FULL
#     verification (allowlist, nuspec metadata, double-pack reproducibility, and the multi-TFM isolated consumer
#     smoke test); for pull_request/push-to-main it runs the faster pack+allowlist+metadata-only path, since
#     dotnet-quality.yml already runs the full script for those triggers. It also asserts, for a trusted tag
#     push only, that the packed .nuspec's <version> exactly matches `dotnet-v<version>` for the triggering tag
#     (dotnet/scripts/verify-release-tag.ps1) before anything is uploaded -- a manual workflow_dispatch instead
#     only records the packed version, since there is no tag to validate against in that mode (manual dispatch is
#     restricted below to `refs/heads/main` only, so there is never a tag/package-version pair to mismatch there
#     either). It requires no secrets and no elevated permissions beyond `contents: read`, so it is safe to run
#     on every pull request, including from forks -- this is the credential-free "SBOM/package checks" gate.
#   - `validate-attestation-eligibility` (`needs: sbom`, `permissions: contents: read` -- deliberately NO
#     `id-token`/`attestations`/`artifact-metadata`) is the ONLY place this workflow decides whether the
#     triggering event/ref/commit is allowed to reach attestation, and it makes that decision using TRUSTED code
#     from the repository's real `main` branch (`actions/checkout` with `ref: main`, never `github.ref`) --
#     deliberately BEFORE the OIDC-permissioned job below ever starts, and never using any code an operator's
#     `workflow_dispatch`-selected branch could have modified. This ordering exists because `workflow_dispatch`
#     (and, in principle, a tag push) runs a job's steps using the exact file content present on the SELECTED
#     ref -- including this workflow's own YAML and every script it calls -- so a job that both (a) had
#     `id-token`/`attestations` write permissions and (b) checked out and executed validator code FROM that same
#     selected ref could have its own validation logic silently rewritten by whoever controls that ref (e.g. a
#     patched `verify-attestation-ref.ps1` that always reports "eligible", or a workflow YAML with the ancestry
#     check deleted). By checking out `main` unconditionally first and running dotnet/scripts/
#     verify-attestation-ref.ps1 (backed by `Test-AttestationRefEligible` in dotnet/scripts/ReleaseVersionTag.ps1)
#     from THAT trusted checkout, passing only the plain event-name/ref/sha STRINGS from the triggering context as
#     inert `env:` data (never as executable code), this job's PASS/FAIL outcome cannot be forged by anything an
#     operator's selected ref controls. `Test-AttestationRefEligible` requires a `push` to be a real `dotnet-v*`
#     release tag matching this repository's exact grammar, or a `workflow_dispatch` to target EXACTLY
#     `refs/heads/main` -- manual dispatch of a tag is deliberately never eligible, even one with valid grammar,
#     because there is no equivalent trusted-validator tag/package-version match check performed for a manual
#     dispatch (unlike the `sbom` job's tag-push path above); restricting manual attestation to `main` only is the
#     simplest policy that cannot let a tag naming a version the packed artifact does not actually contain reach
#     attestation. A second step then runs `git merge-base --is-ancestor` (against the full history this trusted
#     checkout fetched) to prove the triggering COMMIT is real, verified ancestry of `origin/main`, not merely a
#     ref whose NAME happened to match. This job's only output is the plain, already-GitHub-verified commit SHA
#     that triggered the run (`github.sha` is a real property of the triggering event, not attacker-supplied free
#     text) -- for the downstream job below to check out, never any decision or script content originating from
#     the selected ref.
#   - `provenance-attestation` (`needs: [sbom, validate-attestation-eligibility]`) requests a GitHub
#     build-provenance attestation (actions/attest-build-provenance, GitHub's own first-party SLSA-style
#     attestation over the ambient, real GitHub Actions OIDC identity for this repository and workflow run -- not
#     a fabricated publisher identity) over the exact artifact the `sbom` job already produced, verified, and
#     version/tag-checked. This is the ONLY job with `id-token`/`attestations`/`artifact-metadata` write
#     permissions, and by design it never runs any script, action input, or shell command sourced from the
#     operator-selected ref: it does not check out repository code at all (attest-build-provenance needs only the
#     downloaded artifact and the run's ambient OIDC identity, not a source checkout), so there is no opportunity
#     for a compromised selected-ref checkout to influence this job's behavior even in principle. Its `if:`
#     mirrors `validate-attestation-eligibility`'s coarse trigger prefilter (this is a cheap, non-authoritative
#     early-exit only -- the `needs:` dependency on the trusted validator job above is the real, authoritative
#     gate, since GitHub will not run this job at all if that job fails). The `dotnet-release-attestation` GitHub
#     Environment (an owner-configured protection gate) remains a genuine, additional, independent layer of
#     defense-in-depth on top of both jobs' logic, not a substitute for either. It never runs for `pull_request`,
#     so a fork PR can never reach these permissions at all.
#
# Neither job publishes the package anywhere or requires an owner-provided secret.
#
# NuGet package signing (Authenticode-style code signing over the .nupkg itself, distinct from the SLSA-style
# build attestation above) remains BLOCKED: it requires an owner-issued, organization-approved code-signing
# certificate and a decision on trusted-signing infrastructure, both of which depend on
# docs/decisions/0013-establish-project-and-publishing-governance.md, which is still `proposed` (unconfirmed) as
# of this workflow's authoring. Inventing a certificate/secret here would fabricate an unconfirmed publishing
# identity, which this repository's engineering workflow explicitly forbids. The signing step below is kept
# workflow-ready (correct command, correct inputs) but permanently disabled (`if: false`) with this blocker
# documented inline, so accepting ADR 0013 and provisioning a certificate secret is the only change needed to
# activate it; see dotnet/README.md's Status section for the same blocker surfaced to package consumers.
#
# Supply-chain note: actions pinned exactly as in dotnet-security.yml/dotnet-quality.yml.
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "dotnet-v*"
  workflow_dispatch:
    inputs:
      confirm_attestation:
        description: >
          Set to "yes" to also run the provenance-attestation job for this manual run (in addition to the
          always-run SBOM job). Has no effect for pull_request/push triggers, which are gated purely by event
          type and ref below. Requires the dotnet-release-attestation environment to approve the run.
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM (credential-free)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # A trusted `dotnet-v*` tag push (the only trigger that can ever reach the gated provenance-attestation
      # job below) and an operator-initiated workflow_dispatch both run the FULL verify-package.ps1 (pack,
      # exact-match allowlist, nuspec metadata, double-pack reproducibility, and the multi-TFM isolated consumer
      # smoke test) -- this workflow is the only one that ever runs on a tag push (dotnet-quality.yml's `on:`
      # only covers pull_request/push-to-main/workflow_dispatch), so it cannot rely on that other workflow having
      # already verified a tag-pushed artifact. A plain pull_request/push-to-main run here uses the faster
      # pack+allowlist+metadata-only path (still never a naked/unverified `dotnet pack`) since dotnet-quality.yml
      # already runs the full script for those triggers on both OS matrix legs.
      #
      # `github.event_name`/`github.ref` are passed through step-level `env:` values, never interpolated directly
      # into this script's source text: GitHub Actions substitutes `${{ }}` expressions into the YAML string
      # BEFORE the shell ever parses it, so a ref containing a quote, a `$()` subexpression, or a semicolon could
      # otherwise break out of the intended string literal and execute arbitrary code on the runner. A tag name
      # is not restricted to "safe" characters by git itself (only a handful of characters are forbidden, and
      # `$`, `(`, `)`, backticks, and quotes are all still legal in a git ref), so this is a real injection
      # surface, not a theoretical one -- see dotnet/scripts/ReleaseVersionTag.ps1's Test-ValidReleaseTagGrammar
      # doc comment for the identical rationale already applied to the tag/version-match step further below.
      - name: Determine verification depth
        id: verify-depth
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] || \
             { [[ "$EVENT_NAME" == "push" ]] && [[ "$REF" == refs/tags/dotnet-v* ]]; }; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      # Pack, package-content allowlist, nuspec metadata, and (on a trusted tag push or manual dispatch)
      # reproducibility + consumer smoke all live in the one script dotnet-quality.yml also runs, so this job's
      # SBOM/checksum/upload/attestation subject is always the exact same *verified* primary .nupkg/.snupkg this
      # script already checked -- never an independent, unverified `dotnet pack` invocation. verify-package.ps1
      # never cleans dotnet/artifacts/packages itself (only its own scratch reproducibility-comparison directory),
      # so the primary artifacts it just packed remain on disk for every step below.
      - name: Pack and verify the package (allowlist, metadata; full verification on a trusted tag push/dispatch)
        shell: pwsh
        working-directory: dotnet
        env:
          # Passed through env, not interpolated into this script's source text, for the same reason as every
          # other `${{ github.* }}`/`${{ steps.*.outputs.* }}` value in this workflow -- see this job's first
          # step's comment. This particular value only ever contains the literal string "true" or "false" (this
          # workflow's own prior step produced it), so it carries no realistic injection payload today, but is
          # still passed this way so the pattern remains uniform and does not silently regress if that prior
          # step's logic ever changes to derive this value from less-trusted input.
          VERIFY_DEPTH_FULL: ${{ steps.verify-depth.outputs.full }}
        run: |
          # NOTE: switches must be splatted from a hashtable (@{ Name = $true }), never a string array of
          # '-Name' tokens -- array splatting only maps to *positional* parameters and would otherwise pass
          # these dashed strings straight through as positional arguments, which verify-package.ps1 has none of.
          $extraArgs = @{}
          if ($env:VERIFY_DEPTH_FULL -ne 'true') {
            $extraArgs['SkipReproducibility'] = $true
            $extraArgs['SkipConsumerSmoke'] = $true
          }
          ./scripts/verify-package.ps1 -Configuration Release @extraArgs

      # Refuses to let a mismatched tag/version pair reach SBOM upload or (via the downstream provenance job)
      # attestation: the packed .nuspec's <version> must exactly equal `dotnet-v<version>` for the tag that
      # triggered this run, or the job fails here, before anything is uploaded. See
      # dotnet/scripts/verify-release-tag.ps1/ReleaseVersionTag.ps1 for the pure comparison logic and
      # dotnet/scripts/verify-release-tag.tests.ps1 for its match/mismatch/pre-release self-test.
      - name: Verify tag matches package version (trusted dotnet-v* tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dotnet-v')
        shell: pwsh
        working-directory: dotnet
        env:
          # Passed as an environment variable, never interpolated into the script's source text below: a ref
          # name containing a quote, `$()`, or a semicolon must be treated purely as inert data, not re-parsed
          # as PowerShell syntax. See verify-release-tag.ps1's header comment for the full rationale.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $nupkg = Get-ChildItem artifacts/packages -Filter *.nupkg | Select-Object -First 1 -ExpandProperty FullName
          ./scripts/verify-release-tag.ps1 -NupkgPath $nupkg -RefName $env:RELEASE_TAG -EnforceMatch

      # A manual workflow_dispatch run is restricted (by validate-attestation-eligibility below) to `refs/heads/
      # main` only, so there is never a tag to validate a package version against here -- this step only
      # records/prints the packed version and the ref this run happened on; it never fails for a "mismatch".
      - name: Record package version for this run (workflow_dispatch, no tag to match)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        working-directory: dotnet
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $nupkg = Get-ChildItem artifacts/packages -Filter *.nupkg | Select-Object -First 1 -ExpandProperty FullName
          ./scripts/verify-release-tag.ps1 -NupkgPath $nupkg -RefName $env:RELEASE_TAG

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dotnet/artifacts/packages
          format: spdx-json
          output-file: dotnet/artifacts/packages/MongoDB.AgentFramework.sbom.spdx.json
          upload-artifact: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dotnet/artifacts/packages
          format: cyclonedx-json
          output-file: dotnet/artifacts/packages/MongoDB.AgentFramework.sbom.cyclonedx.json
          upload-artifact: false

      - name: Checksum manifest
        working-directory: dotnet/artifacts/packages
        shell: pwsh
        run: |
          Get-ChildItem -File | ForEach-Object {
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)"
          } | Set-Content -Path checksums.sha256.txt
          Get-Content checksums.sha256.txt

      - name: Upload packages, SBOMs, and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-sbom-and-package
          path: |
            dotnet/artifacts/packages/*.nupkg
            dotnet/artifacts/packages/*.snupkg
            dotnet/artifacts/packages/*.sbom.*.json
            dotnet/artifacts/packages/checksums.sha256.txt
          if-no-files-found: error
          retention-days: 14


  # Decides, using ONLY trusted code checked out from `main`, whether this run's event/ref/commit is eligible to
  # reach the OIDC-permissioned attestation job below. See this file's header comment for the full
  # trusted-code-first rationale (why executing a validator FROM the operator-selected ref, in a job that already
  # holds attestation permissions, would let that same ref forge its own "eligible" verdict). This job never
  # requests `id-token`/`attestations`/`artifact-metadata` permissions -- there is nothing here for a compromised
  # selected ref to gain by tampering with, since a forged "pass" from this job still cannot itself sign, attest,
  # or exfiltrate anything; it can only (at most) cause `provenance-attestation` to start, which then independent
  # of this job's own trustworthiness, checks out no operator-controlled code and runs only two pinned, well-known
  # actions.
  validate-attestation-eligibility:
    name: Validate attestation eligibility (trusted main checkout only)
    needs: sbom
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dotnet-v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_attestation == 'yes')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      validated-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      # Deliberately checks out the repository's real `main` branch -- NEVER `github.ref`/the default event
      # ref -- so every script this job runs below is the trusted, protected-branch version, regardless of what
      # ref or tag actually triggered this workflow run. `fetch-depth: 0` (full history, not the default shallow
      # clone) is required both so `origin/main` is available locally for the ancestry check below, and because a
      # full (unshallowed) fetch retrieves the commit objects for every ref in this repository, including
      # whatever ref/tag/commit actually triggered this run -- even though the checked-out working tree itself is
      # `main`.
      - name: Checkout trusted main (never the operator-selected/triggering ref)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      # The workflow-logic ref-shape gate described in this file's header comment. `github.event_name`/
      # `github.ref` are the triggering event's own plain data (never executable code -- they are only ever a
      # short event-type string and a ref name), passed through step-level `env:` values and never interpolated
      # into this script's source text, for the same injection rationale as every other `${{ github.* }}` value
      # in this workflow (see the `sbom` job's first step). The SCRIPT being executed, however, is always the one
      # just checked out from trusted `main` above, never one from the ref this data describes.
      - name: Validate attestation ref is eligible
        shell: pwsh
        working-directory: dotnet
        env:
          ATTESTATION_EVENT_NAME: ${{ github.event_name }}
          ATTESTATION_REF: ${{ github.ref }}
        run: |
          ./scripts/verify-attestation-ref.ps1 -EventName $env:ATTESTATION_EVENT_NAME -Ref $env:ATTESTATION_REF

      # Ancestry/commit validation: proves the actual triggering commit is reachable from origin/main's history,
      # not merely that the ref's NAME matched the expected shape above. A ref name check alone cannot catch a
      # `dotnet-v*` tag (or, in principle, a differently-named ref) pointing at a commit that was never actually
      # merged into `main`.
      - name: Validate commit is reachable from origin/main (ancestry check)
        shell: bash
        env:
          ATTESTATION_SHA: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$ATTESTATION_SHA" origin/main; then
            echo "::error::Commit $ATTESTATION_SHA is not an ancestor of origin/main; refusing to attest provenance for a commit that never reached the protected main branch."
            exit 1
          fi
          echo "Commit $ATTESTATION_SHA is reachable from origin/main."

      # Records the plain, already-GitHub-verified triggering commit SHA as this job's one output, for
      # `provenance-attestation` to check out below. `github.sha` is a real property of the triggering event (the
      # actual commit GitHub resolved for the selected ref at dispatch/push time) -- an operator can choose WHICH
      # existing ref to trigger this workflow against, but cannot fabricate an arbitrary SHA value here, so this
      # output cannot be forged by anything the selected ref's own (possibly compromised) content controls.
      - name: Record validated commit SHA
        id: record-sha
        shell: bash
        env:
          ATTESTATION_SHA: ${{ github.sha }}
        run: |
          echo "sha=$ATTESTATION_SHA" >> "$GITHUB_OUTPUT"

  # Attests build provenance over the exact artifact the `sbom` job already packed and checked -- it never
  # re-packs -- so the attestation subject is provably the same bytes that passed the SBOM/checksum step. This
  # job intentionally requires elevated, secret-adjacent permissions (id-token/attestations/artifact-metadata)
  # that a fork pull_request must never receive, and it never checks out or executes ANY code from the
  # operator-selected/triggering ref: its only inputs are the artifact `actions/download-artifact` fetches (from
  # the already-verified `sbom` job) and the plain, already-validated commit SHA `validate-attestation-eligibility`
  # produced above -- both pinned marketplace actions it runs are well-known, do not execute repository script
  # content, and do not depend on a source checkout at all. Its `if:` mirrors the coarse trigger prefilter used by
  # `validate-attestation-eligibility` above (a fast, cheap, NON-authoritative early exit that keeps this job from
  # even starting on an ordinary push to `main` -- the authoritative gate is this job's `needs:` dependency on
  # that trusted-`main`-checkout validator job, which GitHub will not let this job run past if it fails).
  provenance-attestation:
    name: Provenance attestation (trusted release ref only)
    needs: [sbom, validate-attestation-eligibility]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dotnet-v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_attestation == 'yes')
    runs-on: ubuntu-latest
    environment: dotnet-release-attestation
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # Checks out the EXACT commit SHA validate-attestation-eligibility already validated (never `github.ref`
      # directly) purely so this job's own context/logs are unambiguously anchored to that specific, ancestry- and
      # eligibility-verified commit -- attest-build-provenance itself needs no source checkout at all (it attests
      # over the downloaded artifact and this run's ambient OIDC identity), and no step in this job ever executes
      # any file from this checkout as a script/command; it exists only as pinned, auditable context.
      - name: Checkout the validated commit (context only; never executed as script/command)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate-attestation-eligibility.outputs.validated-sha }}
          persist-credentials: false

      - name: Download packages and SBOMs from the sbom job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-sbom-and-package
          path: dotnet/artifacts/packages

      # SLSA-style build provenance over this workflow run's own (real, GitHub-issued) OIDC identity -- distinct
      # from, and not a substitute for, the NuGet package signing documented as blocked below.
      - name: Attest build provenance for the packed artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dotnet/artifacts/packages/*.nupkg
            dotnet/artifacts/packages/*.snupkg

      # BLOCKED (see file header): no owner-issued NuGet code-signing certificate or ADR 0013 acceptance exists
      # yet. This step is intentionally never executed (`if: false`, independent of and in addition to this
      # job's own trusted-ref gate above); it documents the exact command a future, owner-approved signing
      # secret would need, without inventing that secret or claiming a signature exists.
      - name: "Sign NuGet package (blocked: no signing certificate/ADR 0013 acceptance yet)"
        if: false
        working-directory: dotnet
        run: >
          dotnet nuget sign artifacts/packages/*.nupkg
          --certificate-path "${{ secrets.NUGET_SIGNING_CERTIFICATE_PATH }}"
          --certificate-password "${{ secrets.NUGET_SIGNING_CERTIFICATE_PASSWORD }}"
          --timestamper http://timestamp.digicert.com
