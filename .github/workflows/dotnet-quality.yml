name: .NET build, test, and package quality

# Implements the "dotnet-quality" job from docs/spec/quality-release.md's CI workflow topology: restore, build
# every target framework with warnings as errors, formatting/analyzer validation, unit tests, pack, and a NuGet
# install/runtime smoke test from the produced package (not a project reference). Credentialed Search-capable
# deployment integration tests are covered separately by dotnet-integration.yml, gated behind an approved
# environment/secrets per that same spec section; this workflow only ever runs credential-free checks, so it is
# safe to run on every pull request, including from forks.
#
# TFM matrix note: every .NET target framework this package ships (net8.0/net9.0/net10.0) already builds from a
# single multi-targeted `dotnet build`/`dotnet pack` invocation (see src/MongoDB.AgentFramework/MongoDB.AgentFramework.csproj's
# <TargetFrameworks>), so a second matrix dimension over TFMs would not add real coverage here. The OS axis below
# is the dimension that does: it exercises this workflow's own tooling (the .NET SDK, `dotnet format`, PowerShell
# `verify-package.ps1`) on both of this repository's supported development platforms.
#
# Supply-chain note: every action below is pinned to an immutable full commit SHA (not a mutable tag) with a
# trailing `# vX.Y.Z` comment recording the release that SHA corresponds to, matching dotnet-security.yml.
#
# Compatibility-matrix note: the dotnet-agent-framework-compat job below is a separate credential-free job (not
# an extra dotnet-quality matrix dimension) because it deliberately re-restores/builds/tests against a *different*
# Agent Framework version per matrix entry via an MSBuild property override, rather than exercising this
# workflow's own OS/tooling variance; see dotnet/scripts/verify-agent-framework-compatibility.ps1.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-quality:
    name: dotnet-quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        working-directory: dotnet
        run: dotnet restore MongoDB.AgentFramework.slnx

      # Covers "formatting/analyzer validation" from docs/spec/quality-release.md's .NET quality gates. Analyzer
      # diagnostics (including the PublicAPI analyzer's RS0016/RS0017 for undeclared public API surface changes)
      # are separately promoted to build errors by each project's TreatWarningsAsErrors, so the build step below
      # catches those; this step catches whitespace/style formatting drift specifically.
      - name: Verify formatting (no changes)
        working-directory: dotnet
        run: dotnet format MongoDB.AgentFramework.slnx --verify-no-changes --verbosity diagnostic

      - name: Build all target frameworks (Release, warnings as errors)
        working-directory: dotnet
        run: dotnet build MongoDB.AgentFramework.slnx --configuration Release --no-restore

      # Every project in the solution sets TreatWarningsAsErrors, so a clean exit code here already proves zero
      # warnings; Search-capable-deployment integration tests (Trait Category integration-*) skip cleanly (not
      # fail) without MONGODB_URI/MONGODB_DATABASE, exactly as they do for a local contributor without credentials.
      - name: Unit tests (Release, all projects)
        working-directory: dotnet
        run: dotnet test MongoDB.AgentFramework.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      # Pack, package-content allowlist, reproducibility (double-pack comparison), and the clean isolated NuGet
      # consumer smoke test (tests/PackageSmokeTest) all live in one script so local and CI runs exercise
      # identically; see dotnet/scripts/verify-package.ps1 for the full step-by-step rationale.
      - name: Pack and verify the package (allowlist, reproducibility, consumer smoke)
        shell: pwsh
        working-directory: dotnet
        run: ./scripts/verify-package.ps1 -Configuration Release

      # `dotnet build` only ever accepts one project or solution argument (MSB1008: "Only one project can
      # be specified" if given several csproj paths on one command line), so every sample must be built in its
      # own invocation. This loop discovers every directory under samples/ instead of hardcoding a project list,
      # so a future new/removed/renamed sample can never silently drift out of sync with this check.
      - name: Build all sample projects
        shell: pwsh
        working-directory: dotnet
        run: |
          $ErrorActionPreference = 'Stop'
          $samples = Get-ChildItem -Path samples -Directory | Select-Object -ExpandProperty Name
          if ($samples.Count -eq 0) { throw 'No sample projects found under samples/.' }
          foreach ($sample in $samples) {
            Write-Output "== Building sample: $sample =="
            dotnet build "samples/$sample/$sample.csproj" --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Sample '$sample' failed to build (exit code $LASTEXITCODE)." }
          }
          Write-Output "All $($samples.Count) sample projects built successfully."

      - name: Upload packed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages-${{ matrix.os }}
          path: |
            dotnet/artifacts/packages/*.nupkg
            dotnet/artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

  dotnet-agent-framework-compat:
    name: dotnet-agent-framework-compat (${{ matrix.agent-framework-version }})
    runs-on: ubuntu-latest
    # Compatibility-matrix gate for docs/spec/compatibility-migration.md: MongoDB.AgentFramework.csproj and
    # MongoDB.AgentFramework.Tests.csproj both reference Microsoft.Agents.AI.Abstractions/Workflows through a
    # single $(AgentFrameworkVersion) MSBuild property that defaults to the tracked [1.13.0,1.17.0) range. This
    # job overrides that property to each reflection-verified matrix bound (1.13.0 minimum, 1.16.0 newest; see
    # docs/development/persistence/dotnet-contract-research.md and dotnet-checkpoint-contract-research.md) via
    # `-p:AgentFrameworkVersion=<exact version>` on restore/build/test -- it never edits a tracked .csproj, and
    # the package's own default range is unaffected (see dotnet/scripts/verify-agent-framework-compatibility.ps1,
    # which this job runs, for the full step-by-step rationale and local-repro instructions). Credential-free:
    # safe to run on every pull request, including from forks.
    strategy:
      fail-fast: false
      matrix:
        agent-framework-version:
          - "1.13.0"
          - "1.16.0"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Verify Agent Framework compatibility matrix bound
        shell: pwsh
        working-directory: dotnet
        run: ./scripts/verify-agent-framework-compatibility.ps1 -Configuration Release -Versions "${{ matrix.agent-framework-version }}"
