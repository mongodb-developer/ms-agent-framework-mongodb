name: Release Python package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing protected tag in python-v<version> form"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-python-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate protected release tag and package version
        working-directory: python
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"python-v[0-9]+\.[0-9]+\.[0-9]+(?:[a-z0-9.-]+)?", tag) is None:
              raise SystemExit("tag must use python-v<version>")
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          version = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE)
          if version is None or tag != f"python-v{version.group(1)}":
              raise SystemExit("tag does not match python/pyproject.toml")
          PY
          test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install release tools
        working-directory: python
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Run credential-free release gate
        working-directory: python
        run: |
          python -m pytest --cov=agent_framework_mongodb --cov-report=term -q
          python -m ruff check src tests samples scripts ../scripts/scan_credentials.py
          python -m ruff format --check src tests samples scripts ../scripts/scan_credentials.py
          python -m mypy
          python -m pyright
          python scripts/check_api_baseline.py api-baseline.json
          python ../scripts/scan_credentials.py
      - name: Build and validate exact artifacts
        working-directory: python
        run: |
          python -m build --outdir dist/packages
          python -m twine check dist/packages/*
          python scripts/verify_artifacts.py dist/packages/*.whl dist/packages/*.tar.gz
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --no-cache-dir dist/packages/*.whl
          .release-smoke/bin/python scripts/smoke_public_api.py
          .release-smoke/bin/python -m pydoc agent_framework_mongodb > /dev/null
          .release-smoke/bin/python -m pip install --disable-pip-version-check \
            --upgrade pip setuptools
          pip-audit --path .release-smoke/lib/python3.10/site-packages \
            --format cyclonedx-json \
            --output dist/agent-framework-mongodb.sbom.cdx.json
          sha256sum dist/packages/* dist/*.sbom.cdx.json > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: python-release-${{ inputs.tag }}
          path: python/dist/
          if-no-files-found: error
          retention-days: 30

  provenance:
    needs: build
    if: ${{ vars.PYTHON_PROVENANCE_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-release-${{ inputs.tag }}
          path: dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/packages/*.whl
            dist/packages/*.tar.gz

  publish:
    needs: [build, provenance]
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        needs.provenance.result == 'success' &&
        vars.PYPI_ENVIRONMENT != ''
      }}
    runs-on: ubuntu-latest
    environment: ${{ vars.PYPI_ENVIRONMENT }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-release-${{ inputs.tag }}
          path: dist
      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/packages
