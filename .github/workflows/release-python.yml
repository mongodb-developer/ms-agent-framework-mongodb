name: Release Python package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing protected tag in python-v<version> form"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-python-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/checkout v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Validate protected release tag and package version
        working-directory: python
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_VERSION="$(python scripts/validate_release_tag.py "$RELEASE_TAG" \
            --pyproject pyproject.toml --baseline api-baseline.json)"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          test "$(git tag --points-at HEAD --list "$RELEASE_TAG")" = "$RELEASE_TAG"
      - name: Install release tools
        working-directory: python
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Run credential-free release gate
        working-directory: python
        run: |
          python -m pytest --cov=agent_framework_mongodb --cov-report=term -q
          python -m ruff check src tests samples scripts ../scripts/scan_credentials.py
          python -m ruff format --check src tests samples scripts ../scripts/scan_credentials.py
          python -m mypy
          python -m pyright
          python scripts/check_api_baseline.py api-baseline.json
          python ../scripts/scan_credentials.py
      - name: Build and validate exact artifacts
        working-directory: python
        run: |
          python -m build --outdir dist/packages
          python -m twine check dist/packages/*.whl dist/packages/*.tar.gz
          python scripts/verify_artifacts.py dist/packages/*.whl dist/packages/*.tar.gz
          python -m venv .release-smoke-wheel
          .release-smoke-wheel/bin/python -m pip install --no-cache-dir dist/packages/*.whl
          .release-smoke-wheel/bin/python scripts/smoke_public_api.py --expected-version "$RELEASE_VERSION"
          .release-smoke-wheel/bin/python -m pydoc agent_framework_mongodb > /dev/null
          python -m venv .release-smoke-sdist
          .release-smoke-sdist/bin/python -m pip install --no-cache-dir dist/packages/*.tar.gz
          .release-smoke-sdist/bin/python scripts/smoke_public_api.py --expected-version "$RELEASE_VERSION"
          .release-smoke-sdist/bin/python -m pydoc agent_framework_mongodb > /dev/null
          .release-smoke-wheel/bin/python -m pip install --disable-pip-version-check \
            --upgrade pip setuptools
          pip-audit --path .release-smoke-wheel/lib/python3.10/site-packages \
            --format cyclonedx-json \
            --output dist/agent-framework-mongodb.sbom.cdx.json
          (cd dist/packages && sha256sum *) > dist/PACKAGE_SHA256SUMS
          sha256sum dist/packages/* dist/*.sbom.cdx.json > dist/SHA256SUMS
          python scripts/verify_artifacts.py --supplemental dist/*.sbom.cdx.json dist/PACKAGE_SHA256SUMS dist/SHA256SUMS
      - uses: actions/upload-artifact@11d5960a326750d5838078e36cf38b85af677262 # actions/upload-artifact v4
        with:
          name: python-release-${{ inputs.tag }}
          path: python/dist/
          if-no-files-found: error
          retention-days: 30

  provenance:
    needs: build
    if: ${{ vars.PYTHON_PROVENANCE_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/download-artifact v4
        with:
          name: python-release-${{ inputs.tag }}
          path: dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # actions/attest-build-provenance v2
        with:
          subject-path: |
            dist/packages/*.whl
            dist/packages/*.tar.gz

  publish:
    needs: [build, provenance]
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        needs.provenance.result == 'success' &&
        vars.PYPI_ENVIRONMENT != ''
      }}
    runs-on: ubuntu-latest
    environment: ${{ vars.PYPI_ENVIRONMENT }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/download-artifact v4
        with:
          name: python-release-${{ inputs.tag }}
          path: dist
      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # pypa/gh-action-pypi-publish release/v1
        with:
          packages-dir: dist/packages

  verify-published:
    needs: [build, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ vars.PYPI_ENVIRONMENT }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/checkout v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/download-artifact v4
        with:
          name: python-release-${{ inputs.tag }}
          path: dist
      - name: Wait for and download exact published artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#python-v}"
          mkdir published
          for attempt in $(seq 1 20); do
            rm -f published/*
            if python -m pip download --disable-pip-version-check --no-cache-dir --no-deps \
              --only-binary=:all: --dest published "agent-framework-mongodb==$VERSION" &&
              python -m pip download --disable-pip-version-check --no-cache-dir --no-deps \
              --no-binary=:all: --dest published "agent-framework-mongodb==$VERSION"; then
              break
            fi
            if [ "$attempt" = 20 ]; then
              echo "Published artifacts were not available before timeout." >&2
              exit 1
            fi
            sleep 15
          done
          (cd published && sha256sum --check ../dist/PACKAGE_SHA256SUMS)
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Verify published wheel
        run: |
          python -m venv .published-smoke-wheel
          .published-smoke-wheel/bin/python -m pip install --no-cache-dir published/*.whl
          .published-smoke-wheel/bin/python python/scripts/smoke_public_api.py --expected-version "$RELEASE_VERSION"
      - name: Verify published source distribution
        run: |
          python -m venv .published-smoke-sdist
          .published-smoke-sdist/bin/python -m pip install --no-cache-dir published/*.tar.gz
          .published-smoke-sdist/bin/python python/scripts/smoke_public_api.py --expected-version "$RELEASE_VERSION"
