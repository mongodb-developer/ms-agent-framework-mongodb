name: CodeQL

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/codeql.yml"
  push:
    branches:
      - "main"
      - "feature/python-implementation"
      - "build/python-packaging-release"
    paths:
      - "python/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # github/codeql-action v4.39.1
        with:
          languages: python
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # github/codeql-action v4.39.1
        with:
          category: "/language:python"
