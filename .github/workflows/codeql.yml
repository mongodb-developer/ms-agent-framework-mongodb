name: CodeQL

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/codeql.yml"
  push:
    branches:
      - "main"
      - "feature/python-implementation"
      - "build/python-packaging-release"
    paths:
      - "python/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # github/codeql-action v3.37.6
        with:
          languages: python
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # github/codeql-action v3.37.6
        with:
          category: "/language:python"
