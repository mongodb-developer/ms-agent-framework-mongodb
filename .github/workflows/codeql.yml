name: CodeQL

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/codeql.yml"
  push:
    branches:
      - "main"
      - "feature/python-implementation"
      - "build/python-packaging-release"
    paths:
      - "python/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/checkout v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b611370bb5703a7efb587f9e7d136a0bb6f3c8cc # github/codeql-action v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@b611370bb5703a7efb587f9e7d136a0bb6f3c8cc # github/codeql-action v3
        with:
          category: "/language:python"
