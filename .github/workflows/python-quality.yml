name: Python quality

on:
  pull_request:
    paths:
      - "python/**"
      - "scripts/scan_credentials.py"
      - ".github/workflows/python-quality.yml"
  push:
    paths:
      - "python/**"
      - "scripts/scan_credentials.py"
      - ".github/workflows/python-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package and quality tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest --cov=agent_framework_mongodb --cov-report=term -q
      - name: Run Ruff
        run: |
          python -m ruff check src tests samples ../scripts/scan_credentials.py
          python -m ruff format --check src tests samples ../scripts/scan_credentials.py
      - name: Run MyPy
        run: python -m mypy
      - name: Run Pyright
        run: python -m pyright
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke test exact wheel
        run: |
          python -m venv .artifact-smoke-wheel
          .artifact-smoke-wheel/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .artifact-smoke-wheel/bin/python -c "import agent_framework_mongodb"
      - name: Smoke test exact source distribution
        run: |
          python -m venv .artifact-smoke-sdist
          .artifact-smoke-sdist/bin/python -m pip install --disable-pip-version-check dist/*.tar.gz
          .artifact-smoke-sdist/bin/python -c "import agent_framework_mongodb"
