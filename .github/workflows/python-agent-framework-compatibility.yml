name: Python Agent Framework compatibility

on:
  pull_request:
    paths:
      - "python/**"
      - "scripts/scan_credentials.py"
      - ".github/workflows/python-agent-framework-compatibility.yml"
  push:
    branches:
      - main
      - build/python-packaging-release
    paths:
      - "python/**"
      - "scripts/scan_credentials.py"
      - ".github/workflows/python-agent-framework-compatibility.yml"
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      include_preview:
        description: "Also test the latest non-yanked preview, when one exists"
        required: true
        default: true
        type: boolean
      exact_version:
        description: "Optional exact non-yanked agent-framework-core PEP 440 version"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: python-framework-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/checkout v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python v5
        with:
          python-version: "3.10"
      - name: Install ecosystem version parser
        run: python -m pip install --disable-pip-version-check "packaging>=24,<26"
      - name: Resolve versions from official PyPI metadata
        id: versions
        working-directory: python
        env:
          INCLUDE_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.include_preview }}
          EXACT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.exact_version || '' }}
        run: |
          arguments=()
          if [ "$INCLUDE_PREVIEW" = "true" ]; then
            arguments+=(--include-preview)
          fi
          if [ -n "$EXACT_VERSION" ]; then
            arguments+=(--exact "$EXACT_VERSION")
          fi
          python scripts/resolve_framework_versions.py "${arguments[@]}" \
            --json-output compatibility-reports/resolution.json \
            --markdown-output compatibility-reports/resolution.md
          cat compatibility-reports/resolution.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@11d5960a326750d5838078e36cf38b85af677262 # actions/upload-artifact v4
        with:
          name: python-framework-version-resolution
          path: python/compatibility-reports/
          if-no-files-found: error
          retention-days: 30

  compatibility:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: python
    env:
      FRAMEWORK_VERSION: ${{ matrix.version }}
      REPORT_DIR: compatibility-reports/${{ matrix.label }}-${{ matrix.version }}
    steps:
      - uses: actions/checkout@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/checkout v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package tools and exact framework version
        id: install
        continue-on-error: true
        run: |
          mkdir -p "$REPORT_DIR"
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip install --disable-pip-version-check \
            --force-reinstall "agent-framework-core==$FRAMEWORK_VERSION"
          python -m pip check
          python -m pip freeze > "$REPORT_DIR/pip-freeze.txt"
      - name: Run complete credential-free tests
        id: tests
        continue-on-error: true
        run: python -m pytest --junitxml="$REPORT_DIR/pytest.xml" -q
      - name: Run quality and API gates
        id: quality
        continue-on-error: true
        run: |
          python -m ruff check src tests samples scripts ../scripts/scan_credentials.py
          python -m ruff format --check src tests samples scripts ../scripts/scan_credentials.py
          python -m mypy
          python -m pyright
          python scripts/check_api_baseline.py api-baseline.json
          python ../scripts/scan_credentials.py
      - name: Build and validate distributions
        id: package
        continue-on-error: true
        run: |
          rm -rf build dist/compatibility
          python -m build --outdir dist/compatibility
          python -m twine check dist/compatibility/*.whl dist/compatibility/*.tar.gz
          python scripts/verify_artifacts.py \
            dist/compatibility/*.whl dist/compatibility/*.tar.gz
      - name: Test clean package consumers
        id: consumer
        continue-on-error: true
        run: |
          python -m venv .compatibility-wheel
          .compatibility-wheel/bin/python -m pip install --disable-pip-version-check \
            "agent-framework-core==$FRAMEWORK_VERSION" dist/compatibility/*.whl
          .compatibility-wheel/bin/python scripts/smoke_public_api.py
          .compatibility-wheel/bin/python -m pydoc agent_framework_mongodb > /dev/null
          python -m venv .compatibility-sdist
          .compatibility-sdist/bin/python -m pip install --disable-pip-version-check \
            "agent-framework-core==$FRAMEWORK_VERSION" dist/compatibility/*.tar.gz
          .compatibility-sdist/bin/python scripts/smoke_public_api.py
      - name: Write compatibility reports and enforce outcomes
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          CONSUMER_OUTCOME: ${{ steps.consumer.outcome }}
          CHANNEL: ${{ matrix.channel }}
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p "$REPORT_DIR"
          cat > "$REPORT_DIR/summary.md" <<EOF
          # Agent Framework Core compatibility

          - Selection: \`$LABEL\`
          - Version: \`$FRAMEWORK_VERSION\`
          - Channel: \`$CHANNEL\`
          - Install: **$INSTALL_OUTCOME**
          - Tests: **$TEST_OUTCOME**
          - Quality: **$QUALITY_OUTCOME**
          - Package: **$PACKAGE_OUTCOME**
          - Consumer installs: **$CONSUMER_OUTCOME**
          EOF
          python -c "import json, os, pathlib; pathlib.Path(os.environ['REPORT_DIR'], 'summary.json').write_text(json.dumps({'label': os.environ['LABEL'], 'version': os.environ['FRAMEWORK_VERSION'], 'channel': os.environ['CHANNEL'], 'install': os.environ['INSTALL_OUTCOME'], 'tests': os.environ['TEST_OUTCOME'], 'quality': os.environ['QUALITY_OUTCOME'], 'package': os.environ['PACKAGE_OUTCOME'], 'consumer': os.environ['CONSUMER_OUTCOME']}, indent=2) + '\n', encoding='utf-8')"
          cat "$REPORT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          test "$INSTALL_OUTCOME" = success
          test "$TEST_OUTCOME" = success
          test "$QUALITY_OUTCOME" = success
          test "$PACKAGE_OUTCOME" = success
          test "$CONSUMER_OUTCOME" = success
      - uses: actions/upload-artifact@11d5960a326750d5838078e36cf38b85af677262 # actions/upload-artifact v4
        if: always()
        with:
          name: python-framework-${{ matrix.label }}-${{ matrix.version }}
          path: python/compatibility-reports/${{ matrix.label }}-${{ matrix.version }}/
          if-no-files-found: error
          retention-days: 30
