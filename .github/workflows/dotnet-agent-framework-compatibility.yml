name: .NET Agent Framework upstream compatibility

on:
  workflow_dispatch:
    inputs:
      exact_version:
        description: Optional exact common listed version to test in addition to latest stable and preview
        required: false
        type: string
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Resolve latest stable, latest preview, and optional exact version
        id: resolve
        shell: pwsh
        working-directory: dotnet
        env:
          EXACT_VERSION: ${{ inputs.exact_version }}
        run: ./scripts/resolve-agent-framework-versions.ps1 -Mode AllDispatch -ExactVersion $env:EXACT_VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-framework-version-resolution
          path: dotnet/artifacts/agent-framework-version-resolution/*
          if-no-files-found: error

  compatibility:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore, test, build, pack, and consumer-smoke exact version
        shell: pwsh
        working-directory: dotnet
        run: ./scripts/verify-agent-framework-compatibility.ps1 -Configuration Release -Versions "${{ matrix.version }}"
      - name: Upload TRX, JSON, and Markdown reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-framework-compat-${{ matrix.version }}
          path: dotnet/artifacts/agent-framework-compat-results/*
          if-no-files-found: error
