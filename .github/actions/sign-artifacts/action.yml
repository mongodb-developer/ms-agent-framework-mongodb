name: Sign artifacts with Garasign
description: >-
  Create an armored, detached GPG signature (<file>.sig) for each artifact
  using the Garasign container and move the signatures into $RELEASE_ASSETS.
  Requires release-setup to have run first. Mirrors
  mongodb-labs/drivers-github-tools/gpg-sign@v3.

inputs:
  filenames:
    description: Space-separated file paths or glob patterns to sign (for example "dist/*").
    required: true
  ecr_registry:
    description: ECR registry that hosts the Garasign images.
    default: "901841024863.dkr.ecr.us-east-1.amazonaws.com"
  ecr_repository:
    description: Garasign git image repository (it also carries gpg).
    default: release-infrastructure/garasign-git

runs:
  using: composite
  steps:
    - name: Create detached signatures
      shell: bash
      env:
        ECR_REGISTRY: ${{ inputs.ecr_registry }}
        ECR_REPOSITORY: ${{ inputs.ecr_repository }}
        FILENAMES: ${{ inputs.filenames }}
      run: |
        set -eu
        : "${GARASIGN_ENVFILE:?run release-setup before sign-artifacts}"
        : "${RELEASE_ASSETS:?run release-setup before sign-artifacts}"

        # Expand globs on the host so the container receives concrete paths.
        files=()
        for pattern in $FILENAMES; do
          for f in $pattern; do
            if [ -f "$f" ]; then
              files+=("$f")
            fi
          done
        done
        if [ "${#files[@]}" -eq 0 ]; then
          echo "::error::No files matched '$FILENAMES'"
          exit 1
        fi

        docker run --rm \
          --env-file="$GARASIGN_ENVFILE" \
          -v "$(pwd):$(pwd)" \
          -w "$(pwd)" \
          "${ECR_REGISTRY}/${ECR_REPOSITORY}" \
          /bin/bash -c "gpgloader && for f in ${files[*]}; do gpg --detach-sign --armor --output \"\$f.sig\" \"\$f\"; done"

        echo "### Signed artifacts" >> "$GITHUB_STEP_SUMMARY"
        for f in "${files[@]}"; do
          mv "$f.sig" "$RELEASE_ASSETS/"
          echo "- $(basename "$f") -> $(basename "$f").sig" >> "$GITHUB_STEP_SUMMARY"
        done
