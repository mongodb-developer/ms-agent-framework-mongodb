name: Release setup
description: >-
  Assume the AWS release role through GitHub OIDC, log in to the Garasign ECR
  registry, load signing secrets from AWS Secrets Manager, and export the
  environment variables used by the garasign-git, sign-artifacts, and
  create-draft-release actions. Mirrors mongodb-labs/drivers-github-tools/setup@v3.

inputs:
  aws_role_arn:
    description: AWS IAM role (trusting this repository's OIDC subject) that can read the release secret.
    required: true
  aws_region:
    description: AWS region of the release role and Secrets Manager secret.
    required: true
  aws_secret_id:
    description: >-
      AWS Secrets Manager secret id. Its JSON must contain garasign-username,
      garasign-password, and gpg-key-id; gpg-public-url is optional.
    required: true
  ecr_registry_id:
    description: AWS account id of the ECR registry that hosts the Garasign images.
    default: "901841024863"
  ecr_role_arn:
    description: Read-only role used to pull the Garasign images from ECR.
    default: "arn:aws:iam::901841024863:role/ecr-role-gha-ro"
  ecr_region:
    description: Region of the ECR registry.
    default: us-east-1

runs:
  using: composite
  steps:
    # ECR login happens first so the Docker credential survives the second
    # role assumption below.
    - name: Assume ECR read-only role
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ inputs.ecr_role_arn }}
        role-session-name: release-ecr
        aws-region: ${{ inputs.ecr_region }}

    - name: Log in to the Garasign ECR registry
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      with:
        registries: ${{ inputs.ecr_registry_id }}

    - name: Assume release secrets role
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        role-session-name: release-secrets
        aws-region: ${{ inputs.aws_region }}

    - name: Load release secrets into the environment
      uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
      with:
        secret-ids: ${{ inputs.aws_secret_id }}
        parse-json-secrets: true

    - name: Export Garasign, GPG, and release-asset variables
      shell: bash
      env:
        AWS_SECRET_ID: ${{ inputs.aws_secret_id }}
      run: |
        set -eu
        # aws-secretsmanager-get-secrets exports each JSON key as
        # <SECRET_ID>_<KEY>, upper-cased with "-" and "/" folded to "_".
        # Strip that prefix so the keys become GARASIGN_USERNAME, GPG_KEY_ID, ...
        prefix="$(echo "$AWS_SECRET_ID" | tr '[:lower:]' '[:upper:]' | sed -r 's/[-/]+/_/g')_"
        for var in $(compgen -A variable | grep "^${prefix}" || true); do
          declare "${var#"$prefix"}=${!var}"
        done
        : "${GARASIGN_USERNAME:?missing garasign-username in $AWS_SECRET_ID}"
        : "${GARASIGN_PASSWORD:?missing garasign-password in $AWS_SECRET_ID}"
        : "${GPG_KEY_ID:?missing gpg-key-id in $AWS_SECRET_ID}"

        umask 077
        GARASIGN_ENVFILE=/tmp/garasign-envfile
        cat > "$GARASIGN_ENVFILE" <<EOF
        GRS_CONFIG_USER1_USERNAME=$GARASIGN_USERNAME
        GRS_CONFIG_USER1_PASSWORD=$GARASIGN_PASSWORD
        EOF

        RELEASE_ASSETS=/tmp/release-assets
        mkdir -p "$RELEASE_ASSETS"
        echo "$GITHUB_RUN_ID" > "$RELEASE_ASSETS/release_run_id.txt"

        {
          echo "GARASIGN_ENVFILE=$GARASIGN_ENVFILE"
          echo "GPG_KEY_ID=$GPG_KEY_ID"
          echo "GPG_PUBLIC_URL=${GPG_PUBLIC_URL:-}"
          echo "RELEASE_ASSETS=$RELEASE_ASSETS"
        } >> "$GITHUB_ENV"

    # Local (not --global) so the mounted checkout carries the identity into
    # the Garasign container when it creates the annotated tag.
    - name: Configure git identity for release automation
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
